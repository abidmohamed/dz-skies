name: Update data and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 3 * *"        # 04:17 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: write               # to commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ hashFiles('pipeline/config.py') }}
      - run: pip install -r requirements.txt

      # A push only rebuilds from the Eurostat files already in data/. The monthly run and manual runs query Eurostat again.
      - name: Run pipeline (push)
        if: github.event_name == 'push'
        run: python run_all.py --skip-eurostat
      - name: Run pipeline (full refresh)
        if: github.event_name != 'push'
        run: python run_all.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data ml/results
          git diff --cached --quiet || (git commit -m "Refresh Eurostat data and forecasts" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
